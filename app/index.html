<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TGRAM - Hybrid Blockchain Gateway</title>
  <style>
    :root { --bg: #070b12; --card: #111827; --border: #1f2937; --primary: #38bdf8; --text: #f1f5f9; --ok: #4ade80; --warn: #fbbf24; }
    body { background: var(--bg); color: var(--text); font-family: monospace; padding: 1rem; margin: 0; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h2, h3 { color: var(--primary); margin-top: 0; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; }
    .mod { background: #0b111e; border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; font-size: 0.85rem; text-align: center; transition: 0.2s; }
    .mod:hover { border-color: var(--primary); transform: translateY(-2px); }
    .mod strong { display: block; margin-bottom: 0.3rem; color: var(--primary); }
    .btn { background: linear-gradient(90deg, #229ed9, #0284c7); border: none; color: white; padding: 0.8rem; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 0.5rem; font-family: monospace; }
    .btn:active { opacity: 0.8; }
    .input-group { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    input, select { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border); background: #0b111e; color: white; font-family: monospace; box-sizing: border-box; }
    .token-balance { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.3rem; color: #94a3b8; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .hidden { display: none !important; }
    #chat-box { background: #070a10; padding: 0.8rem; border-radius: 8px; max-height: 200px; overflow-y: auto; margin-bottom: 0.6rem; font-size: 0.85rem; border: 1px solid var(--border); }
    .tab-buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tab-btn { flex: 1; background: #1e293b; border: 1px solid var(--border); color: white; padding: 0.6rem; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: black; border-color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🌐 TGRAM Gateway</h2>
    <p id="tg-status">Prüfe Sitzung...</p>
    <p id="wallet-banner" class="ok" style="font-weight: bold;"></p>
    <button id="app-unified-btn" class="btn">Telegram & Wallet synchronisieren</button>
    <div id="ton-connect-root" style="display:none;"></div>
  </div>

  <div class="card" id="dashboard" style="opacity: 0.5; pointer-events: none;">
    <h3>💱 Währungssystem & Ökosystem</h3>
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('swap')">Swap</button>
      <button class="tab-btn" onclick="switchTab('staking')">Staking</button>
      <button class="tab-btn" onclick="switchTab('vault')">XP Vault</button>
    </div>

    <!-- SWAP MODUL -->
    <div id="tab-swap">
      <div class="input-group">
        <select id="swap-from">
          <option value="TON">TON</option>
          <option value="NEC">NEC</option>
          <option value="BBC">BBC</option>
          <option value="AXF">AXF</option>
        </select>
        <select id="swap-to">
          <option value="NEC">NEC</option>
          <option value="BBC">BBC</option>
          <option value="AXF">AXF</option>
          <option value="TON">TON</option>
        </select>
      </div>
      <input type="number" id="swap-amount" placeholder="Betrag eingeben..." />
      <button class="btn" onclick="executeSwap()">Token tauschen</button>
    </div>

    <!-- STAKING MODUL -->
    <div id="tab-staking" class="hidden">
      <div class="token-balance"><span>Verfügbar (NEC):</span><span id="stake-bal">0.00</span></div>
      <input type="number" id="stake-amount" placeholder="NEC Menge zum Staken..." />
      <div class="input-group">
        <select id="stake-pool">
          <option value="30">30 Tage (5% APY)</option>
          <option value="90">90 Tage (12% APY)</option>
          <option value="365">365 Tage (25% APY)</option>
        </select>
      </div>
      <button class="btn" onclick="executeStake()">Staken & Pool stabilisieren</button>
    </div>

    <!-- VAULT MODUL -->
    <div id="tab-vault" class="hidden">
      <p class="warn" style="font-size: 0.85rem;">Gesperrte Vermögenswerte für Arbitrage (AXF):</p>
      <div class="token-balance"><span>XP Level:</span><span id="xp-level" class="ok">1</span></div>
      <div class="token-balance"><span>Gesperrte AXF:</span><span id="vault-bal">0.00</span></div>
      <button class="btn" onclick="claimVault()">Tägliche XP & Rendite abholen</button>
    </div>
  </div>

  <div class="card">
    <h3>🤖 TGRAM Copilot</h3>
    <div id="chat-box"><div><strong>Copilot:</strong> Serverless Proxy aktiv. Frag mich nach TON, NEC, BBC oder AXF.</div></div>
    <div style="display:flex; gap:0.5rem;">
      <input id="chat-input" type="text" placeholder="Deine Frage..." style="flex:1;" />
      <button class="btn" style="width:auto; margin:0;" onclick="askCopilot()">Senden</button>
    </div>
  </div>

  <script>
    let userAddress = null;

    function loadScript(src) {
      return new Promise(r => {
        const s = document.createElement("script");
        s.src = src; s.onload = r; s.onerror = r;
        document.head.appendChild(s);
      });
    }

    // UI Logik
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('[id^="tab-"]').forEach(d => d.classList.add('hidden'));
      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.remove('hidden');
    }

    async function fetchAccountState(addr) {
      try {
        const url = "https://toncenter.com/api/v3/accountStates?address=" + encodeURIComponent(addr) + "&include_boc=false";
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const acc = (data.accounts && data.accounts[0]) || {};
        const ton = (Number(acc.balance || 0) / 1e9).toFixed(4);
        document.getElementById("wallet-banner").textContent = "OWNER: " + addr.slice(0,8) + "..." + addr.slice(-6) + " | " + ton + " TON";
      } catch (e) {
        document.getElementById("wallet-banner").textContent = "OWNER: " + addr.slice(0,10) + "... (Verifiziert)";
      }
    }

    function applyConnectedState(addr) {
      userAddress = addr;
      document.getElementById("app-unified-btn").textContent = "Sitzung aktiv (" + addr.slice(0, 8) + ")";
      document.getElementById("dashboard").style.opacity = "1";
      document.getElementById("dashboard").style.pointerEvents = "auto";
      fetchAccountState(addr);
      
      // Dummy-Daten für UI laden (Später via Cloudflare Bridge)
      document.getElementById("stake-bal").textContent = "1,250.00";
      document.getElementById("vault-bal").textContent = "4,200.00";
    }

    (async () => {
      const p = "https://";
      await loadScript(p + "telegram.org/js/telegram-web-app.js");
      await loadScript(p + "unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js");

      const tg = window.Telegram?.WebApp;
      if (tg && tg.initDataUnsafe?.user) {
        tg.ready(); tg.expand();
        const u = tg.initDataUnsafe.user;
        const isAdmin = (u.username || "").toLowerCase() === "satoramy";
        document.getElementById("tg-status").innerHTML = `Telegram: <span class="ok">@${u.username || u.id}</span> (${isAdmin ? "MASTER / ADMIN" : "USER"})`;
      } else {
        document.getElementById("tg-status").innerHTML = `Telegram: <span class="ok">Web & Mini-App Session</span>`;
      }

      const savedWallet = localStorage.getItem("tgram_owner_wallet");
      if (savedWallet) applyConnectedState(savedWallet);

      if (window.TON_CONNECT_UI) {
        const tc = new TON_CONNECT_UI.TonConnectUI({
          manifestUrl: window.location.origin + "/TGRAM/tonconnect-manifest.json",
          buttonRootId: "ton-connect-root"
        });
        tc.onStatusChange(wallet => {
          if (wallet) {
            localStorage.setItem("tgram_owner_wallet", wallet.account.address);
            applyConnectedState(wallet.account.address);
          }
        });
        document.getElementById("app-unified-btn").onclick = async () => {
          if (tc.connected && tc.account) applyConnectedState(tc.account.address);
          else await tc.openModal();
        };
      }
    })();

    // --- INTERAKTIVE FUNKTIONEN (Platzhalter für Smart-Contract Calls) ---
    function executeSwap() {
      const from = document.getElementById('swap-from').value;
      const to = document.getElementById('swap-to').value;
      const amt = document.getElementById('swap-amount').value;
      if(!amt || amt <= 0) return alert("Bitte Betrag eingeben.");
      alert(`[DEX] Simulierter Swap: ${amt} ${from} -> ${to}. (Wird später via Cloudflare-Proxy an den Smart Contract gesendet)`);
      document.getElementById('swap-amount').value = '';
    }

    function executeStake() {
      const amt = document.getElementById('stake-amount').value;
      if(!amt || amt <= 0) return alert("Bitte NEC Betrag eingeben.");
      alert(`[STAKING] ${amt} NEC erfolgreich in den Pool eingezahlt.`);
      document.getElementById('stake-amount').value = '';
    }

    function claimVault() {
      alert(`[XP-VAULT] 50 AXF und 10 XP erfolgreich abgeholt!`);
      let lvl = parseInt(document.getElementById('xp-level').textContent);
      document.getElementById('xp-level').textContent = lvl + 1;
    }

    // --- COPILOT ---
    async function askCopilot() {
      const inp = document.getElementById("chat-input");
      const box = document.getElementById("chat-box");
      const q = inp.value.trim();
      if (!q) return;
      box.innerHTML += `<div><strong>Du:</strong> ${q}</div>`;
      inp.value = "";
      try {
        const p = "https://";
        const res = await fetch(p + "text.pollinations.ai/" + encodeURIComponent("Du bist TGRAM Copilot für TON, NEC, BBC und AXF. Antworte kurz und präzise. " + q));
        const ans = await res.text();
        box.innerHTML += `<div><strong>Copilot:</strong> ${ans}</div>`;
      } catch (e) {
        box.innerHTML += `<div><strong>Copilot:</strong> Verbindungsfehler zum Serverless Proxy.</div>`;
      }
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
