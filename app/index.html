<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TGRAM Mini App | @Satoramy</title>
  <script src="https://telegram.org"></script>
  <script src="https://unpkg.com"></script>
  <style>
    body { background: #070b12; color: #f1f5f9; font-family: monospace; padding: 1.2rem; margin: 0; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    h2, h3 { color: #38bdf8; margin-top: 0; }
    .ok { color: #4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <h2>TGRAM Mini App</h2>
    <p id="tg-user">Telegram Session wird geladen...</p>
    <div id="ton-connect"></div>
    <p id="wallet-info" style="margin-top:0.8rem;">Wallet: Nicht verbunden</p>
  </div>

  <div class="card">
    <h3>Module (TON | NEC | BBC)</h3>
    <p>• Wallet & Owner-Vault<br>• AMM DEX Swap<br>• Launchpad & Energy Storage</p>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      const el = document.getElementById('tg-user');
      if (user) {
        const isOwner = (user.username || '').toLowerCase() === 'satoramy';
        el.innerHTML = `User: <strong>@${user.username || user.id}</strong> | Rolle: <span class="ok">${isOwner ? 'ADMIN / OWNER' : 'USER'}</span>`;
      } else {
        el.textContent = 'Im Browser geöffnet (Admin-Ziel: @Satoramy)';
      }
    }

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://github.io',
      buttonRootId: 'ton-connect'
    });

    tonConnectUI.onStatusChange(wallet => {
      const wEl = document.getElementById('wallet-info');
      if (wallet) {
        wEl.innerHTML = `<span class="ok">Owner-Wallet verbunden:</span><br>${wallet.account.address}`;
      } else {
        wEl.textContent = 'Wallet: Nicht verbunden';
      }
    });
  </script>
</body>
</html>
