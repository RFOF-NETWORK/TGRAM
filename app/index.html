<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TGRAM Mini App</title>
  <style>
    body { background: #070b12; color: #f1f5f9; font-family: monospace; padding: 1rem; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    h2, h3 { color: #38bdf8; margin-top: 0; }
    .ok { color: #4ade80; }
    .warn { color: #fbbf24; }
    button { font-family: monospace; padding: 0.65rem; border-radius: 6px; border: none; background: #0284c7; color: #fff; cursor: pointer; width: 100%; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>TGRAM Master-Konsole</h2>
    <p id="tg-status">Prüfe Sitzung...</p>
    <p id="wallet-banner" class="ok"></p>
    <button id="app-unified-btn">Wallet verbinden</button>
    <div id="ton-connect-root" style="display:none;"></div>
  </div>

  <script>
    function loadScript(src) {
      return new Promise(r => {
        const s = document.createElement("script");
        s.src = src; s.onload = r; s.onerror = r;
        document.head.appendChild(s);
      });
    }

    // TONCENTER API FIX: /api/v3/ hinzugefügt
    async function fetchAccountStateViaProxy(addr) {
      try {
        const url = "https://toncenter.com/api/v3/accountStates?address=" + encodeURIComponent(addr) + "&include_boc=false";
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const acc = (data.accounts && data.accounts[0]) || {};
        const ton = (Number(acc.balance || 0) / 1e9).toFixed(4);
        document.getElementById("wallet-banner").textContent = "OWNER AKTIV: " + addr.slice(0,6) + "..." + addr.slice(-4) + " (" + ton + " TON)";
      } catch (e) {
        document.getElementById("wallet-banner").textContent = "OWNER AKTIV: " + addr.slice(0,10) + "... (RPC limitiert)";
      }
    }

    function applyConnectedState(addr) {
      document.getElementById("app-unified-btn").textContent = "Sitzung aktiv (" + addr.slice(0, 6) + ")";
      document.getElementById("app-unified-btn").disabled = true;
      fetchAccountStateViaProxy(addr);
    }

    (async () => {
      await loadScript("https://telegram.org/js/telegram-web-app.js");
      await loadScript("https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js");
      
      const tg = window.Telegram?.WebApp;
      if (tg && tg.initDataUnsafe?.user) {
        tg.ready(); tg.expand();
        document.getElementById("tg-status").innerHTML = `Telegram: <span class="ok">@${tg.initDataUnsafe.user.username || "User"}</span>`;
      }

      const savedWallet = localStorage.getItem("tgram_owner_wallet");
      if (savedWallet) applyConnectedState(savedWallet);

      if (window.TON_CONNECT_UI) {
        const tc = new TON_CONNECT_UI.TonConnectUI({
          manifestUrl: window.location.origin + "/TGRAM/tonconnect-manifest.json",
          buttonRootId: "ton-connect-root"
        });
        
        tc.onStatusChange(wallet => {
          if (wallet) {
            localStorage.setItem("tgram_owner_wallet", wallet.account.address);
            applyConnectedState(wallet.account.address);
          }
        });

        document.getElementById("app-unified-btn").onclick = async () => {
          if (tc.connected && tc.account) {
            applyConnectedState(tc.account.address);
          } else {
            await tc.openModal();
          }
        };
      }
    })();
  </script>
</body>
</html>
