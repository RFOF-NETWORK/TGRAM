<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TGRAM | InterBOxSpiderWeb & RFOF-NETWORK</title>
  <script src="https://telegram.org"></script>
  <script src="https://unpkg.com"></script>
  <style>
    body { background: #0b0f17; color: #e2e8f0; font-family: monospace; padding: 1.5rem; max-width: 860px; margin: auto; }
    .card { background: #131a29; border: 1px solid #263248; border-radius: 10px; padding: 1.4rem; margin-bottom: 1.2rem; }
    h1, h2 { color: #38bdf8; margin-top: 0; }
    .badge { display: inline-block; background: #1e293b; padding: 0.3rem 0.6rem; border-radius: 4px; margin: 0.2rem 0.2rem 0.6rem 0; font-size: 0.85rem; }
    .unified-btn { background: linear-gradient(90deg, #229ed9, #0088cc); color: #fff; padding: 0.85rem 1.2rem; border-radius: 10px; border: none; font-family: monospace; font-weight: bold; font-size: 0.95rem; cursor: pointer; width: 100%; margin-top: 0.8rem; }
    .btn-sec { background: #1e293b; color: #38bdf8; padding: 0.7rem 1rem; border-radius: 8px; border: 1px solid #334155; font-family: monospace; cursor: pointer; width: 100%; margin-top: 0.6rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>TGRAM — Hybrid Blockchain & Cloud Gateway</h1>
    <div>
      <span class="badge">Master: InterBOxSpiderWeb</span>
      <span class="badge">Admin: RFOF-NETWORK</span>
      <span class="badge">Ecosystem: TGRAM (@Satoramy)</span>
    </div>
    <p>Verbinde deine Tonkeeper-Wallet über TonConnect – die Adresse wird automatisch an deine laufende Termux-Sitzung übergeben:</p>
    <button class="unified-btn" onclick="unifiedConnect()">Telegram & TonConnect verbinden</button>
    <button class="btn-sec" onclick="window.location.href='./app/index.html'">Weiter zur Mini App & Master-Konsole</button>
    <div id="ton-connect-hidden" style="display:none;"></div>
    <p id="wallet-status" style="margin-top:1rem; color:#94a3b8;">Status: Bereit zur Verbindung</p>
  </div>

  <script>
    let tonConnectUI = null;
    async function syncToTermux(rawAddress) {
      try {
        await fetch('http://127.0.0' + encodeURIComponent(rawAddress));
      } catch (e) {}
    }

    window.addEventListener('load', () => {
      if (window.TON_CONNECT_UI) {
        tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
          manifestUrl: 'https://github.io',
          buttonRootId: 'ton-connect-hidden'
        });
        tonConnectUI.onStatusChange(wallet => {
          const el = document.getElementById('wallet-status');
          if (wallet) {
            el.style.color = '#4ade80';
            el.textContent = 'Owner-Wallet verifiziert & an Termux übergeben.';
            localStorage.setItem('tgram_owner_wallet', wallet.account.address);
            syncToTermux(wallet.account.address);
          }
        });
      }
    });

    async function unifiedConnect() {
      if (tonConnectUI) {
        if (tonConnectUI.connected && tonConnectUI.account) {
          await syncToTermux(tonConnectUI.account.address);
        } else {
          await tonConnectUI.openModal();
        }
      }
    }
  </script>
</body>
</html>
