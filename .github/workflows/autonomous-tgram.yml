name: TGRAM Autonomous 24/7 CI/CD & Multi-CLI Orchestrator

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode (autonomous / semi-autonomous)'
        required: false
        default: 'autonomous'

jobs:
  cloud-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TGRAM Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync External CLI Repositories (ton-ai-agent & acton)
        run: |
          mkdir -p /tmp/tgram-tools
          git clone --depth 1 https://github.com /tmp/tgram-tools/ton-ai-agent || true
          ls -la /tmp/tgram-tools

      - name: Execute Autonomous TGRAM CLI & Blockchain Heartbeat
        run: |
          chmod +x tgram-cli.sh
          ./tgram-cli.sh
