name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install -U pip
          pip install ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --ignore-missing-imports app/ai-agents || true
      - name: Smoke-Test Debug-Listener
        env:
          DEBUG_LOG_DIR: ${{ github.workspace }}/debug
        run: |
          python app/ai-agents/debug_parallel.py --ports 18080 &
          PID=$!
          sleep 1
          curl -fsS "http://127.0.0.1:18080/?address=EQtest"
          kill $PID || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-logs-${{ matrix.python-version }}
          path: debug/
          if-no-files-found: ignore
